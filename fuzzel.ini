# ~/.config/fuzzel/fuzzel.ini
# Tokyo Night themed fuzzel config

[main]
# Font configuration - using NerdFont Mono
font=JetBrainsMono Nerd Font Mono:size=12

# Prompt prefix
prompt="󱓟"
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic

# Fuzzy matching. Renamed upstream — `fuzzy=yes` is rejected by fuzzel 1.14
# with "not a valid option", which aborts the rest of this file.
match-mode=fuzzy
show-actions=yes
terminal=kitty

# Window appearance
width=50
horizontal-pad=20
vertical-pad=10
inner-pad=8

# List configuration
lines=15
tabs=4
line-height=25
letter-spacing=0

# Behavior
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Tokyo Night (Night variant) colors
background=1a1b26ef
text=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7dcfffff
border=7aa2f7ff

[border]
width=2
radius=12

[dmenu]
# dmenu mode settings (if you use fuzzel as dmenu replacement)
exit-immediately-if-empty=no
